# Template for carving samplers
# This template should be used via metaconfiguration like so:

# dimensions: 3
# type: EXPRESSION
# expression: $biomes/abstract/carving/carving_sampler_template.yml:expression
# samplers: $biomes/abstract/carving/carving_sampler_template.yml:samplers
# variables:
#   "<<":
#     - biomes/abstract/carving/carving_sampler_template.yml:variables
#   # Variable Overrides:
#   <variable name>: <value>
#   <variable name>: <value>

variables:
  # These serve as default values that each usage of this template can override for specific adjustments

  carvingThreshold: 0.55 # Higher = less carving
  carvingCap: 1 # Caps the amount of base carving

  cheeseStrength: 0.62 # Higher = larger cheese caves
  cheeseBias: 0.32
  cheeseHorizontalFrequency: 1.1
  cheeseVerticalFrequency: 0.75
  cheeseLayerStrength: 0.3 # Higher = stronger stacked/layered cave shelves
  cheeseLayerGateBias: 0.12
  cheeseLayerHorizontalFrequency: 0.9
  cheeseLayerVerticalFrequency: 5.5
  cheeseLayerSharpness: 6
  cheeseRoughnessStrength: 0.08
  cheeseDeepBoost: 0.06

  # Higher = larger spaghetti caves
  spaghettiAStrength: 0.58
  spaghettiBStrength: 0.57

  # Higher = larger spaghetti caves
  noodleAStrength: 0.605
  noodleBStrength: 0.59

  pillarStrength: 0.5
  pillarRadius: 0.02
  pillarRarenessThreshold: -0.15

  megaCaveStrength: 0.05
  megaCaveSize: 0.3

  # Clamping variables

  carvingMinHeight: ${meta.yml:bottom-y} + 1 # Where all carving will cut off at the bottom of the world
  carvingMinTaper: 4 # How many blocks above the min height should all carving 'fade out'

  cheeseSurfaceBreak: -26 # How many blocks from the surface cheese carving will stop
  cheeseSurfaceBreakTaper: 22 # How many blocks from surface break should cheese carving taper out

  noodleSurfaceBreak: -15 # How many blocks from the surface cheese carving will stop
  noodleSurfaceBreakTaper: 15 # How many blocks from surface break should cheese carving taper out

  spaghettiSurfaceBreak: -15 # How many blocks from the surface spaghetti carving will stop
  spaghettiSurfaceBreakTaper: 30 # How many blocks from surface break should spaghetti carving taper out

  # carvingMaxMode: !!!Must be set in carving configs that use this template!!!
  #                 - 1 = cap carving by land elevation
  #                 - 2 = cap carving by ocean depth
  #                 - Anything else sets to cap by the constant carvingMaxHeight instead
  carvingMaxHeight: -64

  # Terrain variables for clamping max y, shouldn't be overridden
  terrainBase: $customization.yml:terrain-base-y-level
  terrainScale: $customization.yml:terrain-height
  oceanBase: $customization.yml:terrain-ocean-base-y-level
  oceanDepth: $customization.yml:terrain-ocean-depth

expression: | # If > 0 then carve
  -carvingThreshold
  + if(y<carvingMinHeight,0, // Skip unnecessary calculations if y value is below min height
    maskSmooth(
      min(carvingCap,
        max(
          max(
            // Spaghetti Caves
            maskSmooth(
              // Combine two layers 'A' and 'B' of 'spaghetti noise' (the sum of two ridged 3D noise functions)
              max(
                spaghettiAStrength * ((-(|simplex3(x,y+0000,z)|+|simplex3(x,y+1000,z)|)/2)+1),
                spaghettiBStrength * ((-(|simplex3(x,y+2000,z)|+|simplex3(x,y+3000,z)|)/2)+1)
              ),
              // Spaghetti mask
              // These could probably be deduplicated to prevent repeat calculations by using a wrapper function, but this will work for now.
              if(carvingMaxMode=1,elevation(x, z)*terrainScale+terrainBase,if(carvingMaxMode=2,oceanElevation(x, z)*oceanDepth+oceanBase,carvingMaxHeight)) + spaghettiSurfaceBreakTaper,
              if(carvingMaxMode=1,elevation(x, z)*terrainScale+terrainBase,if(carvingMaxMode=2,oceanElevation(x, z)*oceanDepth+oceanBase,carvingMaxHeight)),
              y - spaghettiSurfaceBreak
            ),
            // noodle Caves
            maskSmooth(
              // Combine two layers 'A' and 'B' of 'noodle noise' (the sum of two ridged 3D noise functions)
                max(
                  max(0.5,noodleAStrength * ((-(|simplex3(x,y-0000,z)*2|+|simplex3(x,y-1000,z)*2|)/2)+1)),
                  min(0.5,noodleBStrength * ((-(|simplex3(x,y-2000,z)*2|+|simplex3(x,y-3000,z)*2|)/2)+1))
                ),
              // noodle mask
              // These could probably be deduplicated to prevent repeat calculations by using a wrapper function, but this will work for now.
              if(carvingMaxMode=1,elevation(x, z)*terrainScale+terrainBase,if(carvingMaxMode=2,oceanElevation(x, z)*oceanDepth+oceanBase,carvingMaxHeight)) + noodleSurfaceBreakTaper,
              if(carvingMaxMode=1,elevation(x, z)*terrainScale+terrainBase,if(carvingMaxMode=2,oceanElevation(x, z)*oceanDepth+oceanBase,carvingMaxHeight)),
              y - noodleSurfaceBreak
            )
          ),
          // Cheese caves
          maskSmooth(
            max(0,
              // Broad cave field, deliberately less vertically frequent than the old sampler.
              cheeseStrength * max(0, caveCheese(
                x * cheeseHorizontalFrequency,
                (y + simplex2(x, z) * 5) * cheeseVerticalFrequency,
                z * cheeseHorizontalFrequency
              ) + cheeseBias)

              // Vanilla-like cave_layer approximation: opens stacked horizontal bands only inside broad cheese systems.
              + cheeseLayerStrength
                * max(0, caveCheese(
                  x * cheeseHorizontalFrequency,
                  (y + simplex2(x, z) * 5) * cheeseVerticalFrequency,
                  z * cheeseHorizontalFrequency
                ) + cheeseLayerGateBias)
                * (1 - min(1, |caveLayer(
                  x * cheeseLayerHorizontalFrequency,
                  (y + simplex2(x + 4000, z - 4000) * 3) * cheeseLayerVerticalFrequency,
                  z * cheeseLayerHorizontalFrequency
                )| * cheeseLayerSharpness))

              // Small gated roughness term to break up smooth round walls without carving isolated noise pockets.
              + cheeseRoughnessStrength
                * max(0, caveCheese(
                  x * cheeseHorizontalFrequency,
                  (y + simplex2(x, z) * 5) * cheeseVerticalFrequency,
                  z * cheeseHorizontalFrequency
                ) + cheeseLayerGateBias)
                * (1 - min(1, |caveRoughness(
                  x * 2,
                  y * 2,
                  z * 2
                )| * 2))

              // Slightly favor large cave systems in the deepslate band.
              + lerp(y, -48, cheeseDeepBoost, 24, 0)

              // Keep a reduced legacy mega-cave term only as rare reinforcement, not as the main shape.
              + lerp(megaCaves(x, y, z), 1-megaCaveSize, 0, 1, megaCaveStrength)

              // Pillars suppress carving in rare regions so large rooms get bridges/columns instead of uniform blobs.
              - lerp(cavePillarRareness(x, z), pillarRarenessThreshold, 0, 1, 1)
                * lerp(cavePillars(x, z), -1 + pillarRadius, 0, -1, 1)
                * pillarStrength
            ),
  
            // Cheese mask
            if(carvingMaxMode=1,elevation(x, z)*terrainScale+terrainBase,if(carvingMaxMode=2,oceanElevation(x, z)*oceanDepth+oceanBase,carvingMaxHeight)) + cheeseSurfaceBreakTaper,
            if(carvingMaxMode=1,elevation(x, z)*terrainScale+terrainBase,if(carvingMaxMode=2,oceanElevation(x, z)*oceanDepth+oceanBase,carvingMaxHeight)),
            y - cheeseSurfaceBreak
          )
        )
      ),
      // Bottom of world mask
      carvingMinHeight, carvingMinHeight + carvingMinTaper, y
    )
  )

samplers:
  # Basic 2D fractal simplex noise
  simplex2:
    dimensions: 2
    type: LINEAR
    min: -0.9
    max: 0.9
    sampler:
      type: FBM
      octaves: 4
      sampler:
        type: OPEN_SIMPLEX_2
        frequency: 0.0075

  # Basic 3D fractal simplex noise
  simplex3:
    dimensions: 3
    type: FBM
    octaves: 2
    sampler:
      type: OPEN_SIMPLEX_2
      frequency: 0.0075

  caveCheese:
    dimensions: 3
    type: DOMAIN_WARP
    amplitude: 5
    warp:
      type: OPEN_SIMPLEX_2
      salt: 6021
      frequency: 0.018
    sampler:
      type: FBM
      octaves: 5
      gain: 0.55
      lacunarity: 2
      sampler:
        type: OPEN_SIMPLEX_2
        salt: 6022
        frequency: 0.0065

  caveLayer:
    dimensions: 3
    type: FBM
    octaves: 2
    gain: 0.45
    lacunarity: 2
    sampler:
      type: OPEN_SIMPLEX_2
      salt: 6023
      frequency: 0.0065

  caveRoughness:
    dimensions: 3
    type: FBM
    octaves: 3
    gain: 0.5
    lacunarity: 2.2
    sampler:
      type: OPEN_SIMPLEX_2
      salt: 6024
      frequency: 0.018

  cavePillars:
    dimensions: 2
    type: CELLULAR
    return: CellValue
    frequency: 0.05

  cavePillarRareness:
    dimensions: 2
    type: OPEN_SIMPLEX_2
    salt: 6025
    frequency: 0.02

  megaCaves:
    dimensions: 3
    type: OPEN_SIMPLEX_2
    salt: 777
    frequency: 0.003
